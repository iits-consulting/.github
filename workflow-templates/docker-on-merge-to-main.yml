# Don't forget to add secrets:
# AZURE_CREDENTIALS
# AZURE_DOCKER_USERNAME
# AZURE_DOCKER_PASSWORD
# And tag your commit with app version (semver)

name: Merge stable and release
on:
  push:
    branches:
      - $default-branch

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare-stable:
    name: Build new image version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check PR labels action step
        id: check_pr_labels_major
        uses: shioyang/check-pr-labels-on-push-action@6902edf856909c50ff1d69b2cd7dc0d82f1061b6 # v1.0.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labels: '["major"]'

      - name: Check PR labels action step
        id: check_pr_labels_minor
        uses: shioyang/check-pr-labels-on-push-action@6902edf856909c50ff1d69b2cd7dc0d82f1061b6 # v1.0.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labels: '["minor"]'

      - name: Check PR labels action step
        id: check_pr_labels_patch
        uses: shioyang/check-pr-labels-on-push-action@6902edf856909c50ff1d69b2cd7dc0d82f1061b6 # v1.0.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labels: '["patch"]'

      - name: Select proper label
        env:
          LABEL_MAJOR: ${{ steps.check_pr_labels_major.outputs.result }}
          LABEL_MINOR: ${{ steps.check_pr_labels_minor.outputs.result }}
          LABEL_PATCH: ${{ steps.check_pr_labels_patch.outputs.result }}
        run: |
          if [[ "$LABEL_MAJOR" = true ]]; then
            echo "CORRECT_LABEL=major" >> $GITHUB_ENV
          elif [[ "$LABEL_MINOR" = true ]]; then
            echo "CORRECT_LABEL=minor" >> $GITHUB_ENV
          elif [[ "$LABEL_PATCH" = true ]]; then
            echo "CORRECT_LABEL=patch" >> $GITHUB_ENV
          else
            echo "CORRECT_LABEL=patch" >> $GITHUB_ENV
          fi

      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@27c04b107bd8de27966ed909e0992078a9121de8 # v1

      - name: Put new version to the ENV
        env:
          PREVIOUS_TAG: ${{ steps.previoustag.outputs.tag }}
        run: |
          t=$(echo "$PREVIOUS_TAG" | cut -d- -f1)
          echo "CURRENT_VERSION=${t}" >> $GITHUB_ENV

      - name: Calculate new version
        uses: actions-ecosystem/action-bump-semver@4675bfabe91e6bff16f516e92fb0693e4f3acd79 # v1
        id: bump_semver
        with:
          current_version: ${{ env.CURRENT_VERSION }}
          level: ${{ env.CORRECT_LABEL }}

      - name: Bump version and push tag
        uses: ChloePlanet/github-tag-action@2df1aa77eeff877c3df7b83ec9e93d9376427faa # 2.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ steps.bump_semver.outputs.new_version }}

      - name: Login via Azure CLI
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure registry
        if: success()
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: iitsc.azurecr.io
          username: ${{ secrets.AZURE_DOCKER_USERNAME }}
          password: ${{ secrets.AZURE_DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          tags: iitsc.azurecr.io/images/${{ github.event.repository.name }}:${{ steps.bump_semver.outputs.new_version }}
