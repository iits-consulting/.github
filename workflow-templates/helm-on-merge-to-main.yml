# Don't forget to add secrets:
# ACR_RELEASER_TOKEN

name: Merge stable and release
on:
  push:
    branches:
      - $default-branch

permissions:
  contents: write
  pull-requests: read

env:
  ACR_NAME: iitsc
  ACR_USER_NAME: iits-releaser

jobs:
  lint-and-release-stable:
    name: Enroll new chart version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install helm
        uses: Azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Lint chart
        run: helm lint

      - name: Check PR labels action step
        id: check_pr_labels_major
        uses: shioyang/check-pr-labels-on-push-action@6902edf856909c50ff1d69b2cd7dc0d82f1061b6 # v1.0.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labels: '["major"]'

      - name: Check PR labels action step
        id: check_pr_labels_minor
        uses: shioyang/check-pr-labels-on-push-action@6902edf856909c50ff1d69b2cd7dc0d82f1061b6 # v1.0.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labels: '["minor"]'

      - name: Check PR labels action step
        id: check_pr_labels_patch
        uses: shioyang/check-pr-labels-on-push-action@6902edf856909c50ff1d69b2cd7dc0d82f1061b6 # v1.0.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labels: '["patch"]'

      - name: Select proper label
        env:
          LABEL_MAJOR: ${{ steps.check_pr_labels_major.outputs.result }}
          LABEL_MINOR: ${{ steps.check_pr_labels_minor.outputs.result }}
          LABEL_PATCH: ${{ steps.check_pr_labels_patch.outputs.result }}
        run: |
          if [[ "$LABEL_MAJOR" = true ]]; then
            echo "CORRECT_LABEL=major" >> $GITHUB_ENV
          elif [[ "$LABEL_MINOR" = true ]]; then
            echo "CORRECT_LABEL=minor" >> $GITHUB_ENV
          elif [[ "$LABEL_PATCH" = true ]]; then
            echo "CORRECT_LABEL=patch" >> $GITHUB_ENV
          else
            echo "CORRECT_LABEL=patch" >> $GITHUB_ENV
          fi

      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@27c04b107bd8de27966ed909e0992078a9121de8 # v1

      - name: Put new version to the ENV
        env:
          PREVIOUS_TAG: ${{ steps.previoustag.outputs.tag }}
        run: |
          t=$(echo "$PREVIOUS_TAG" | cut -d- -f1)
          echo "CURRENT_VERSION=${t}" >> $GITHUB_ENV

      - name: Calculate new version
        uses: actions-ecosystem/action-bump-semver@4675bfabe91e6bff16f516e92fb0693e4f3acd79 # v1
        id: bump_semver
        with:
          current_version: ${{ env.CURRENT_VERSION }}
          level: ${{ env.CORRECT_LABEL }}

      - name: Find and replace version in Chart.yaml
        uses: jacobtomlinson/gha-find-replace@2ff30f644d2e0078fc028beb9193f5ff0dcad39e # v3
        with:
          find: "version:.*"
          replace: "version: ${{ steps.bump_semver.outputs.new_version }}"
          include: Chart.yaml

      - name: Commit and push changes
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          add: Chart.yaml
          message: "[Auto-update] version updated"
          tag: ${{ steps.bump_semver.outputs.new_version }}

      - name: Login to ACR using helm
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.ACR_RELEASER_TOKEN }}
        run: |
          echo "$HELM_REGISTRY_PASSWORD" | helm registry login ${{ env.ACR_NAME }}.azurecr.io --username ${{ env.ACR_USER_NAME }} --password-stdin

      - name: Package helm chart
        run: |
          helm package . --version ${{ steps.bump_semver.outputs.new_version }}

      - name: Push chart to ACR
        run: |
          helm push ${{ github.event.repository.name }}-${{ steps.bump_semver.outputs.new_version }}.tgz oci://${{ env.ACR_NAME }}.azurecr.io/charts
