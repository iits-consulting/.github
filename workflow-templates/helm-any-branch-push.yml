# Don't forget to add secrets:
# ACR_RELEASER_TOKEN

name: Lint, PR, pre-Release
on:
  push:
    paths-ignore:
      - ".github/**"
      - "*.md"
      - "LICENSE"
    branches-ignore:
      - $default-branch

permissions:
  contents: write

env:
  ACR_NAME: iitsc
  ACR_USER_NAME: iits-releaser

jobs:
  lint:
    name: Lint & validate K8S manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install helm
        uses: Azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Lint chart
        run: helm lint --strict

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.7.0"
          curl -sSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests with kubeconform
        run: |
          helm template . | kubeconform -strict -summary

  release:
    needs: [lint]
    name: Release new chart version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set variables
        run: |
          echo "GIT_SHA_SHORT=$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_ENV
          echo "BRANCH_NAME=$(echo "${GITHUB_REF##*/}")" >> $GITHUB_ENV

      - name: Get new tag
        run: |
          ct=$(cat Chart.yaml | tr -d " " | grep -oP '(?<=version:)\d+\.\d+\.\d+')
          echo $ct
          if [[ -z $ct ]]
          then
            echo "ERROR: Check your chart version in Chart.yaml file!!!"
            echo "It should have SemVer numbers and be processed by '(?<=version:)\d+\.\d+\.\d+' regexp"
            exit 1
          fi
          echo "NEW_VERSION=${ct}-${{ env.GIT_SHA_SHORT }}" >> $GITHUB_ENV

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: none
          RELEASE_BRANCHES: .*
          CUSTOM_TAG: ${{ env.NEW_VERSION }}

      - name: Install helm
        uses: Azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Login to ACR using helm
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.ACR_RELEASER_TOKEN }}
        run: |
          echo "$HELM_REGISTRY_PASSWORD" | helm registry login ${{ env.ACR_NAME }}.azurecr.io --username ${{ env.ACR_USER_NAME }} --password-stdin

      - name: Package helm chart
        run: |
          helm package . --version ${{ env.NEW_VERSION }}

      - name: Push chart to ACR
        run: |
          helm push ${{ github.event.repository.name }}-${{ env.NEW_VERSION }}.tgz oci://${{ env.ACR_NAME }}.azurecr.io/charts
